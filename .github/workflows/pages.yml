name: Publicar pagina

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_BASE: /warframe-planos/
          VITE_SUPABASE_URL: https://icjkgectkhxnfkocylpg.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImljamtnZWN0a2h4bmZrb2N5bHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM0ODAzNDYsImV4cCI6MjEwOTA1NjM0Nn0.lVPt0p2QbYivEQDAv8bRTLLSG1Agk2aMGX9fB78pcWg
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
